# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ce1d84c1a1f98a976b491723c5e54f4b"
name = "SparkLayer"
application_url = "https://example.com"
embedded = true


[events]
api_version = "unstable"

[[events.subscription]]
handle = "dummy-event"
topic = "Product"
actions = ["update"]
uri = "/webhooks/products/update"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/create"
  topics = [ "customers/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = [ "customers/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/delete"
  topics = [ "customers/delete" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "unauthenticated_read_product_listings,read_companies,read_customers,read_orders,read_payment_terms,read_themes,write_app_proxy,write_companies,write_customers,write_discounts,write_draft_orders,write_merchant_managed_fulfillment_orders,write_metaobject_definitions,write_metaobjects,write_payment_terms,write_products,write_themes"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
url = "https://example.com/apps/sparklayer"
prefix = "apps"
subpath = "sparklayer"

[shop.metafields.sparklayer.storefront_token]
type = "single_line_text_field"
name = "Storefront API Token"
description = "Public Storefront API access token, written by the app on install (storefrontToken.server.ts). Read by the wholesale-pricing-embed script to fetch variant/WSP data client-side."

  [shop.metafields.sparklayer.storefront_token.access]
  admin = "merchant_read"
  storefront = "public_read"

[variant.metafields.sparklayer.wholesale_price]
type = "number_decimal"
name = "Wholesale Price"
description = "B2B wholesale price pushed by SparkLayer price lists (priceListPush.server.ts); read directly by the storefront wholesale-pricing app block"

  [variant.metafields.sparklayer.wholesale_price.access]
  admin = "merchant_read"
  storefront = "public_read"

[variant.metafields.sparklayer.wholesale_price_tiers]
type = "multi_line_text_field"
name = "Wholesale Price Tiers"
description = "JSON array of {minQuantity, price} quantity-break rows for this variant, pushed alongside wholesale_price by priceListPush.server.ts; read by the storefront to price a line by the quantity actually ordered"

  [variant.metafields.sparklayer.wholesale_price_tiers.access]
  admin = "merchant_read"
  storefront = "public_read"

[build]
automatically_update_urls_on_dev = true
